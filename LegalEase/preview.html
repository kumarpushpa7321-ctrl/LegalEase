<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Preview | LegalEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .preview-container {
            background-color: white;
            padding: 40px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            min-height: 800px;
            font-family: 'Times New Roman', Times, serif;
            color: #000;
            white-space: pre-wrap;
            border: 1px solid #ccc;
        }
        .edit-area {
            width: 100%;
            min-height: 800px;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Legal<span>Ease</span></a>
            <div class="d-flex">
                <a href="index.html" class="btn btn-outline-light btn-sm">Home</a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            
            <!-- Sidebar Actions -->
            <div class="col-md-3 col-lg-2 mb-4">
                <div class="card shadow-sm sticky-top" style="top: 80px;">
                    <div class="card-body">
                        <h5 class="card-title text-primary mb-3">Actions</h5>
                        
                        <button id="toggle-edit-btn" class="btn btn-outline-secondary w-100 mb-3">
                            <i class="bi bi-pencil"></i> Edit Text
                        </button>

                        <hr>
                        
                        <h6 class="mb-2">Branding</h6>
                        <div class="mb-3">
                            <label class="form-label small">Upload Logo (JPG/PNG)</label>
                            <input class="form-control form-control-sm" type="file" id="logo-upload" accept="image/png, image/jpeg">
                        </div>

                        <hr>

                        <h6 class="mb-2">Export</h6>
                        <div class="d-grid gap-2">
                            <button class="btn btn-danger btn-sm" onclick="exportDoc('pdf')"><i class="bi bi-file-pdf"></i> Download PDF</button>
                            <button class="btn btn-primary btn-sm" onclick="exportDoc('docx')"><i class="bi bi-file-word"></i> Download DOCX</button>
                            <button class="btn btn-secondary btn-sm" onclick="exportDoc('txt')"><i class="bi bi-file-text"></i> Download TXT</button>
                        </div>
                        
                        <div id="export-error" class="alert alert-danger mt-3 d-none p-2 small"></div>
                    </div>
                </div>
            </div>

            <!-- Preview Area -->
            <div class="col-md-9 col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 id="doc-title-display">Document Preview</h3>
                    <span class="badge bg-success" id="success-badge">Document generated successfully</span>
                </div>
                
                <div class="preview-wrapper position-relative">
                    <div id="document-preview" class="preview-container"></div>
                    <textarea id="document-editor" class="form-control edit-area"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 LegalEase.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/preview.js"></script>
</body>
</html>
